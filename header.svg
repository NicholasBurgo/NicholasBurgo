<svg width="860" height="200" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nicholas Burgo — Data Science + AI + Research = My Passion">
  <style>
    .tw { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.1s ease-in-out infinite; animation-delay: 1.3s; }
    .tw3 { animation: twinkle 2.6s ease-in-out infinite; animation-delay: 0.7s; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .drift { animation: drift 16.5s linear infinite; }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(200px); } }

    .name { font: 700 38px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6edf3; letter-spacing: 2px; }
    .tag { font: 500 17px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #39d353; letter-spacing: 1px; }
    .badge { font: 600 13px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #e6edf3; }
  </style>

  <rect width="860" height="200" fill="#0d1117"/>
