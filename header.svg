<svg width="860" height="170" viewBox="0 0 860 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nicholas Burgo — Data Science + AI + Research = My Passion">
  <style>
    .drift { animation: drift 14s linear infinite; }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(170px); } }
    .tw { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.1s ease-in-out infinite; animation-delay: 1.3s; }
    .tw3 { animation: twinkle 2.6s ease-in-out infinite; animation-delay: 0.7s; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .name {
      font: 700 38px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif;
      fill: #e6edf3;
      letter-spacing: 2px;
    }
    .tag {
      font: 500 17px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace;
      fill: #39d353;
      letter-spacing: 1px;
    }
  </style>

  <rect width="860" height="170" fill="#0d1117"/>

  <g class="drift">
    <g id="stars">
      <circle cx="31" cy="12" r="1.1" fill="#ffffff" opacity="0.7"/>
      <circle cx="87" cy="98" r="1.5" fill="#ffffff" opacity="0.9" class="tw"/>
      <circle cx="128" cy="45" r="0.9" fill="#ffffff" opacity="0.5"/>
      <circle cx="171" cy="132" r="1.2" fill="#ffffff" opacity="0.8"/>
      <circle cx="214" cy="21" r="1.6" fill="#ffffff" opacity="0.9" class="tw2"/>
      <circle cx="243" cy="88" r="0.8" fill="#ffffff" opacity="0.45"/>
      <circle cx="279" cy="151" r="1.1" fill="#ffffff" opacity="0.7"/>
      <circle cx="317" cy="58" r="1.3" fill="#ffffff" opacity="0.85" class="tw3"/>
      <circle cx="349" cy="118" r="0.9" fill="#ffffff" opacity="0.5"/>
      <circle cx="392" cy="9" r="1.4" fill="#ffffff" opacity="0.9"/>
      <circle cx="416" cy="74" r="0.8" fill="#ffffff" opacity="0.4"/>
      <circle cx="451" cy="139" r="1.2" fill="#ffffff" opacity="0.75" class="tw"/>
      <circle cx="487" cy="33" r="1.0" fill="#ffffff" opacity="0.6"/>
      <circle cx="522" cy="104" r="1.5" fill="#ffffff" opacity="0.9" class="tw2"/>
      <circle cx="558" cy="66" r="0.9" fill="#ffffff" opacity="0.5"/>
      <circle cx="586" cy="148" r="1.1" fill="#ffffff" opacity="0.7"/>
      <circle cx="619" cy="17" r="1.3" fill="#ffffff" opacity="0.85"/>
      <circle cx="655" cy="92" r="0.8" fill="#ffffff" opacity="0.45" class="tw3"/>
      <circle cx="691" cy="127" r="1.4" fill="#ffffff" opacity="0.9"/>
      <circle cx="722" cy="52" r="1.0" fill="#ffffff" opacity="0.6"/>
      <circle cx="764" cy="112" r="1.2" fill="#ffffff" opacity="0.8" class="tw"/>
      <circle cx="797" cy="26" r="0.9" fill="#ffffff" opacity="0.5"/>
      <circle cx="833" cy="81" r="1.5" fill="#ffffff" opacity="0.9" class="tw2"/>
      <circle cx="58" cy="160" r="1.0" fill="#ffffff" opacity="0.6"/>
      <circle cx="140" cy="7" r="1.2" fill="#ffffff" opacity="0.75"/>
      <circle cx="308" cy="3" r="0.8" fill="#ffffff" opacity="0.4"/>
      <circle cx="470" cy="163" r="1.1" fill="#ffffff" opacity="0.7" class="tw3"/>
      <circle cx="639" cy="157" r="0.9" fill="#ffffff" opacity="0.5"/>
      <circle cx="741" cy="166" r="1.3" fill="#ffffff" opacity="0.8"/>
      <circle cx="102" cy="70" r="0.7" fill="#ffffff" opacity="0.35"/>
