<svg width="860" height="140" viewBox="0 0 860 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3,400 all-time commits, fueled by coffee">
  <style>
    .tw { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.1s ease-in-out infinite; animation-delay: 1.3s; }
    .tw3 { animation: twinkle 2.6s ease-in-out infinite; animation-delay: 0.7s; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .drift { animation: drift 11.5s linear infinite; }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(140px); } }

    .commits { font: 500 15px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #9198a1; }
    .num { fill: #39d353; font-weight: 700; }
    .coffee { font: 500 11px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #6e7681; letter-spacing: 1px; }
    .steam { animation: steam 3s ease-in-out infinite; opacity: 0; }
    .s1 { animation-delay: 1s; }
    .s2 { animation-delay: 2s; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-14px); } }
  </style>

  <rect width="860" height="140" fill="#0d1117"/>
  <g class="drift">
