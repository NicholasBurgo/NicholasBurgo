<svg width="860" height="70" viewBox="0 0 860 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3,400 all-time commits">
  <style>
    .tw { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.1s ease-in-out infinite; animation-delay: 1.3s; }
    .tw3 { animation: twinkle 2.6s ease-in-out infinite; animation-delay: 0.7s; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .drift { animation: drift 5.8s linear infinite; }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(70px); } }

    .commits { font: 500 15px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #9198a1; }
    .num { fill: #39d353; font-weight: 700; }
  </style>

  <rect width="860" height="70" fill="#0d1117"/>
  <g class="drift">
    <g id="cmstars">
      <circle cx="145" cy="48" r="1.3" fill="#ffffff" opacity="0.72"/>
      <circle cx="412" cy="16" r="1.4" fill="#ffffff" opacity="0.78"/>
      <circle cx="692" cy="36" r="1.2" fill="#ffffff" opacity="0.66"/>
      <circle cx="205" cy="2" r="1.0" fill="#ffffff" opacity="0.53" class="tw3"/>
      <circle cx="503" cy="7" r="1.4" fill="#ffffff" opacity="0.78"/>
      <circle cx="202" cy="17" r="0.7" fill="#ffffff" opacity="0.35"/>
      <circle cx="854" cy="51" r="1.5" fill="#ffffff" opacity="0.84" class="tw2"/>
      <circle cx="529" cy="4" r="1.0" fill="#ffffff" opacity="0.53"/>
      <circle cx="428" cy="10" r="1.6" fill="#ffffff" opacity="0.9"/>
      <circle cx="318" cy="12" r="1.4" fill="#ffffff" opacity="0.78" class="tw"/>
      <circle cx="110" cy="63" r="1.1" fill="#ffffff" opacity="0.59"/>
      <circle cx="474" cy="25" r="1.1" fill="#ffffff" opacity="0.59"/>
      <circle cx="163" cy="4" r="1.5" fill="#ffffff" opacity="0.84"/>
      <circle cx="204" cy="53" r="0.9" fill="#ffffff" opacity="0.47"/>
      <circle cx="829" cy="61" r="1.4" fill="#ffffff" opacity="0.78"/>
      <circle cx="654" cy="40" r="1.4" fill="#ffffff" opacity="0.78" class="tw3"/>
    </g>
    <use href="#cmstars" y="-70"/>
  </g>

  <text x="430" y="42" text-anchor="middle" class="commits"><tspan class="num" id="commit-count">3,400</tspan> all-time commits</text>
</svg>
