name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Inlined from czl9707/gh-space-shooter@v2 so we can pin the version
      # and slow the background stars to match header.svg's drift (~12 px/s).
      # 2.0.5 changed GIF frame duration (2x slower playback); 2.0.4 matches
      # the look this profile shipped with.
      - name: Install gh-space-shooter (pinned, slower stars)
        run: |
          python -m pip install --upgrade pip
          pip install gh-space-shooter==2.0.4
          CONST=$(python -c "import gh_space_shooter.constants as c; print(c.__file__)")
          sed -i 's/^STAR_SPEED_MIN = .*/STAR_SPEED_MIN = 0.55/' "$CONST"
          sed -i 's/^STAR_SPEED_MAX = .*/STAR_SPEED_MAX = 0.75/' "$CONST"
          python -c "from gh_space_shooter.constants import STAR_SPEED_MIN as a, STAR_SPEED_MAX as b; assert (a, b) == (0.55, 0.75); print('star speeds patched:', a, b)"

      - name: Generate game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh-space-shooter NicholasBurgo --output game.gif --strategy random --fps 40

      # All-time commits = sum of yearly commit contributions (incl. private)
      # since account creation (2020). Skips the update if the API returns 0.
      - name: Update commit counter in header
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=0
          for y in $(seq 2020 $(date +%Y)); do
            C=$(gh api graphql -f query="query { user(login: \"NicholasBurgo\") { contributionsCollection(from: \"${y}-01-01T00:00:00Z\", to: \"${y}-12-31T23:59:59Z\") { totalCommitContributions restrictedContributionsCount } } }" -q '.data.user.contributionsCollection | .totalCommitContributions + .restrictedContributionsCount')
            TOTAL=$((TOTAL + C))
          done
          if [ "$TOTAL" -gt 0 ]; then
            FMT=$(python3 -c "print(f'{$TOTAL:,}')")
            echo "all-time commits: $FMT"
            sed -i -E "s|(id=\"commit-count\">)[^<]*|\1${FMT}|" stats.svg
          else
            echo "commit count query returned 0, leaving stats.svg unchanged"
          fi

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          COMMIT_MSG="Update space shooter game GIF"

          git add game.gif stats.svg

          LAST_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "")

          if [ "$LAST_MSG" = "$COMMIT_MSG" ]; then
            echo "Amending previous GIF commit"
            git commit --amend --no-edit
            git push --force-with-lease
          else
            echo "Creating new commit"
            git diff --staged --quiet || git commit -m "$COMMIT_MSG"
            git push
          fi
