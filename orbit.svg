<svg width="860" height="340" viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Research focus areas orbiting an AI core">
  <style>
    .tw { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.1s ease-in-out infinite; animation-delay: 1.3s; }
    .tw3 { animation: twinkle 2.6s ease-in-out infinite; animation-delay: 0.7s; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .drift { animation: drift 28.0s linear infinite; }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(340px); } }

    .sun { animation: sunpulse 5s ease-in-out infinite; }
    @keyframes sunpulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.55; } }
    .focus { font: 500 10px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #7d8590; }
    .core { font: 700 8px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #2b230e; }
    .o0 { animation: spin0 22s linear infinite; transform-origin: 430px 170px; }
    @keyframes spin0 { from { transform: rotate(20deg); } to { transform: rotate(380deg); } }
    .c0 { animation: cspin0 22s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cspin0 { from { transform: rotate(-20deg); } to { transform: rotate(-380deg); } }
    .o1 { animation: spin1 22s linear infinite; transform-origin: 430px 170px; }
    @keyframes spin1 { from { transform: rotate(200deg); } to { transform: rotate(560deg); } }
    .c1 { animation: cspin1 22s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cspin1 { from { transform: rotate(-200deg); } to { transform: rotate(-560deg); } }
    .o2 { animation: spin2 38s linear infinite; transform-origin: 430px 170px; }
    @keyframes spin2 { from { transform: rotate(330deg); } to { transform: rotate(690deg); } }
    .c2 { animation: cspin2 38s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cspin2 { from { transform: rotate(-330deg); } to { transform: rotate(-690deg); } }
    .o3 { animation: spin3 38s linear infinite; transform-origin: 430px 170px; }
    @keyframes spin3 { from { transform: rotate(120deg); } to { transform: rotate(480deg); } }
    .c3 { animation: cspin3 38s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cspin3 { from { transform: rotate(-120deg); } to { transform: rotate(-480deg); } }
    .o4 { animation: spin4 58s linear infinite; transform-origin: 430px 170px; }
    @keyframes spin4 { from { transform: rotate(70deg); } to { transform: rotate(430deg); } }
    .c4 { animation: cspin4 58s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cspin4 { from { transform: rotate(-70deg); } to { transform: rotate(-430deg); } }
    .o5 { animation: spin5 58s linear infinite; transform-origin: 430px 170px; }
    @keyframes spin5 { from { transform: rotate(250deg); } to { transform: rotate(610deg); } }
    .c5 { animation: cspin5 58s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cspin5 { from { transform: rotate(-250deg); } to { transform: rotate(-610deg); } }
  </style>

