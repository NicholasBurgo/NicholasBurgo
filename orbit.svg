      <circle cx="176" cy="222" r="1.0" fill="#ffffff" opacity="0.5"/>
      <circle cx="238" cy="193" r="0.7" fill="#ffffff" opacity="0.35"/>
      <circle cx="324" cy="90" r="1.1" fill="#ffffff" opacity="0.55"/>
