<svg width="860" height="250" viewBox="0 0 860 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Language constellation: Python, TypeScript, Lua, HTML, Rust">
  <style>
    .tw { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.1s ease-in-out infinite; animation-delay: 1.3s; }
    .tw3 { animation: twinkle 2.6s ease-in-out infinite; animation-delay: 0.7s; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .drift { animation: drift 20.6s linear infinite; }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(250px); } }

    .lname { font: 600 13px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #e6edf3; }
    .lpct { font: 500 11px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #9198a1; }
    .title { font: 500 13px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #6e7681; letter-spacing: 1px; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    .p1 { animation-delay: 0.8s; } .p2 { animation-delay: 1.6s; }
    .p3 { animation-delay: 2.4s; } .p4 { animation-delay: 3.2s; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
  </style>

