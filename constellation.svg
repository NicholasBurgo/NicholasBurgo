<svg width="860" height="260" viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Research focus areas as the Big Dipper constellation">
  <style>
    .tw { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.1s ease-in-out infinite; animation-delay: 1.3s; }
    .tw3 { animation: twinkle 2.6s ease-in-out infinite; animation-delay: 0.7s; }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .drift { animation: drift 21.4s linear infinite; }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(260px); } }

    .lname { font: 600 12px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #e6edf3; }
    .sname { font: italic 400 9px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #6e7681; }
    .title { font: 500 13px ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #6e7681; letter-spacing: 1px; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    .p1 { animation-delay: 0.6s; } .p2 { animation-delay: 1.2s; }
    .p3 { animation-delay: 1.8s; } .p4 { animation-delay: 2.4s; }
    .p5 { animation-delay: 3.0s; } .p6 { animation-delay: 3.6s; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
  </style>

